[project]
name = "acme"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/cli", "packages/*"]
# apps/api is a standalone uv project; pi-control-layer is TypeScript, not a Python package.
exclude = ["apps/api", "packages/pi-control-layer"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps/cli"]

[tool.mypy]
strict = true