[project]
name = "acme-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tamila Tiurina", email = "tamila.tiurina@xperi.com" }
]
requires-python = ">=3.12"
dependencies = [
    "acme-core",
    "httpx>=0.28.1",
    "typer>=0.27.2",
]

[project.scripts]
acme-cli = "acme_cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
acme-core = { workspace = true }
